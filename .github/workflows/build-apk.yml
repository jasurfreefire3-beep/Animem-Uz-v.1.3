name: Build Animem Uz Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: |
          cd animem_flutter
          flutter pub get

      - name: Build Release APK
        run: |
          cd animem_flutter
          flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Distribution
        run: |
          cp animem_flutter/build/app/outputs/flutter-apk/app-release.apk animem_uz_v1.0.0.apk

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: animem-uz-release-apk
          path: animem_uz_v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

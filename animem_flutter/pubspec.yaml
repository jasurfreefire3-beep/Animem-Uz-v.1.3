name: animem_mobile
description: "Animem Uz - Professional O'zbekiston Milliy Anime Mobil Ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2

  # Networking & Real-time
  http: ^1.2.1
  dio: ^5.4.3+1
  socket_io_client: ^3.0.1
  url_launcher: ^6.3.0

  # Media & Universal Video Player
  video_player: ^2.8.6
  chewie: ^1.8.1
  webview_flutter: ^4.7.0

  # Storage & Preferences
  shared_preferences: ^2.2.3

  # UI / UX, Liquid Glass & Animations
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  image_picker: ^1.1.1
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
